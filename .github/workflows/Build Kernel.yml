# Build GKI Kernel with SukiSU for iQOO 855 (Enhanced Multi-Source Version)
name: Build GKI Kernel with SukiSU for iQOO 855

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android版本'
        required: true
        type: choice
        default: 'android13'
        options:
          - 'android12'
          - 'android13'
          - 'android14'
          - 'android15'
      kernel_version:
        description: '内核主版本'
        required: true
        type: choice
        default: '4.14'
        options:
          - '4.14'
          - '5.4'
          - '5.10'
          - '5.15'
      kernel_sublevel:
        description: '内核子版本 (如 199)'
        required: true
        type: string
        default: '199'
      security_patch:
        description: '安全补丁日期 (YYYY-MM-DD)'
        required: true
        type: string
        default: '2024-01-05'
      kernel_source:
        description: '内核源码来源'
        required: true
        type: choice
        default: 'aosp'
        options:
          - 'aosp'
          - 'lineageos'
          - 'arrowos'
          - 'custom_repo'
      kernel_repo_url:
        description: '自定义内核仓库地址 (当选择custom_repo时使用)'
        required: false
        type: string
        default: 'https://github.com/torvalds/linux'
      kernel_repo_branch:
        description: '自定义内核分支 (当选择custom_repo时使用)'
        required: false
        type: string
        default: 'v4.14'
      use_susfs:
        description: '启用SUSFS文件系统'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: '启用KPM内核模块'
        required: true
        type: boolean
        default: true
      use_zram:
        description: '启用ZRAM增强算法'
        required: true
        type: boolean
        default: false
      use_kcal:
        description: '启用KCAL色彩控制'
        required: false
        type: boolean
        default: false
      use_kswapd:
        description: '启用改进的KSWAPD'
        required: false
        type: boolean
        default: true
      clone_branch_only:
        description: '仅克隆指定分支 (减少体积)'
        required: false
        type: boolean
        default: true
      apply_privacy_patches:
        description: '应用隐私保护补丁'
        required: false
        type: boolean
        default: true
      enable_oc:
        description: '启用超频支持'
        required: false
        type: boolean
        default: false
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        default: 'gki'
        options:
          - 'gki'
          - 'permissive'
          - 'debug'

permissions:
  contents: read
  actions: read
  checks: write
  id-token: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_VERSION: ${{ github.event.inputs.android_version }}
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
      KERNEL_SUBLEVEL: ${{ github.event.inputs.kernel_sublevel }}
      SECURITY_PATCH: ${{ github.event.inputs.security_patch }}
      KERNEL_SOURCE: ${{ github.event.inputs.kernel_source }}
      KERNEL_REPO_URL: ${{ github.event.inputs.kernel_repo_url }}
      KERNEL_REPO_BRANCH: ${{ github.event.inputs.kernel_repo_branch }}
      USE_SUSFS: ${{ github.event.inputs.use_susfs }}
      USE_KPM: ${{ github.event.inputs.use_kpm }}
      USE_ZRAM: ${{ github.event.inputs.use_zram }}
      USE_KCAL: ${{ github.event.inputs.use_kcal }}
      USE_KSWAPD: ${{ github.event.inputs.use_kswapd }}
      CLONE_BRANCH_ONLY: ${{ github.event.inputs.clone_branch_only }}
      APPLY_PRIVACY_PATCHES: ${{ github.event.inputs.apply_privacy_patches }}
      ENABLE_OC: ${{ github.event.inputs.enable_oc }}
      BUILD_MODE: ${{ github.event.inputs.build_mode }}
      KERNEL_SRC_DIR: "${{ github.workspace }}/kernel-src"
      OUTPUT_DIR: "${{ github.workspace }}/output"

    steps:
      - name: 📋 Check Workflow Inputs
        run: |
          echo "=== Workflow Inputs ==="
          echo "Android Version: $ANDROID_VERSION"
          echo "Kernel Version: $KERNEL_VERSION.$KERNEL_SUBLEVEL"
          echo "Security Patch: $SECURITY_PATCH"
          echo "Kernel Source: $KERNEL_SOURCE"
          echo "Build Mode: $BUILD_MODE"
          echo "========================"

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🧹 Clean and Optimize Environment
        run: |
          # Clean system package cache
          sudo apt clean
          sudo apt autoremove -y --purge
          
          # Remove large unused packages
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          
          # Create swap file if memory is low
          if [ "$(free -g | awk '/Mem:/ {print $2}')" -lt 16 ]; then
            echo "Memory < 16GB, creating swap file..."
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          
          # Show disk and memory usage
          echo "=== System Status ==="
          df -h
          free -h

      - name: 📦 Setup Build Dependencies
        run: |
          set -euo pipefail
          
          echo "=== Installing Build Dependencies ==="
          
          # Update package list
          sudo apt-get update -y
          
          # Install core dependencies
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev liblz4-tool lz4 rsync device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-10-aarch64-linux-gnu \
            clang-14 clang-15 clang-16 lld llvm llvm-14 llvm-15 \
            git git-lfs curl wget unzip aria2 p7zip-full pigz \
            kmod cpio python3 python3-pip python3-venv xxd \
            ccache ninja-build pkg-config libgmp-dev libmpc-dev libmpfr-dev \
            libisl-dev libxml2-utils libcap-dev libaudit-dev libdw-dev \
            libunwind-dev libiberty-dev libnuma-dev libpci-dev \
            libbabeltrace-dev libslang2-dev libperl-dev binutils-dev \
            libbfd-dev libopcodes-dev libdebuginfod-dev zlib1g-dev \
            liblzma-dev libzstd-dev libbz2-dev libcurl4-openssl-dev \
            libarchive-dev libjson-c-dev libprocps-dev libsystemd-dev \
            linux-tools-common linux-tools-generic
          
          # Setup git lfs
          git lfs install || true
          
          # Install latest repo tool
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          
          # Show tool versions
          echo "=== Tool Versions ==="
          clang --version || true
          gcc-aarch64-linux-gnu --version || true
          repo --version
          make --version
          python3 --version

      - name: 💾 Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.KERNEL_SUBLEVEL }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.KERNEL_SUBLEVEL }}-
            ${{ runner.os }}-ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-

      - name: 📥 Prepare Kernel Source
        id: kernel_source
        run: |
          set -euo pipefail
          
          echo "=== Preparing Kernel Source ==="
          mkdir -p "$KERNEL_SRC_DIR"
          cd "$KERNEL_SRC_DIR"
          
          case "$KERNEL_SOURCE" in
            "aosp")
              echo "Using AOSP kernel source..."
              AOSP_MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
              
              # Construct branch name
              if [ "$KERNEL_VERSION" = "4.14" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-4.14"
              elif [ "$KERNEL_VERSION" = "5.4" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-5.4"
              elif [ "$KERNEL_VERSION" = "5.10" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-5.10"
              else
                BRANCH_NAME="common-$ANDROID_VERSION-$KERNEL_VERSION"
              fi
              
              echo "Attempting branch: $BRANCH_NAME"
              
              # Initialize repo
              if [ "$CLONE_BRANCH_ONLY" = "true" ]; then
                repo init -u "$AOSP_MANIFEST_URL" -b "$BRANCH_NAME" --depth=1
              else
                repo init -u "$AOSP_MANIFEST_URL" -b "$BRANCH_NAME"
              fi
              
              # Sync source with retries
              MAX_RETRIES=3
              for i in $(seq 1 $MAX_RETRIES); do
                echo "Sync attempt $i/$MAX_RETRIES..."
                if repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync; then
                  echo "Sync successful"
                  break
                elif [ $i -eq $MAX_RETRIES ]; then
                  echo "Sync failed after $MAX_RETRIES attempts"
                  exit 1
                fi
                sleep 10
              done
              ;;
              
            "lineageos")
              echo "Using LineageOS kernel source..."
              git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150 -b lineage-$ANDROID_VERSION kernel
              ;;
              
            "arrowos")
              echo "Using ArrowOS kernel source..."
              git clone --depth=1 https://github.com/ArrowOS/android_kernel_qcom_sm8150 -b arrow-$ANDROID_VERSION kernel
              ;;
              
            "custom_repo")
              echo "Using custom kernel repository..."
              if [ -z "$KERNEL_REPO_URL" ] || [ "$KERNEL_REPO_URL" = "https://github.com/torvalds/linux" ]; then
                echo "Using default Linux stable branch"
                BRANCH_TO_CLONE="v$KERNEL_VERSION.$KERNEL_SUBLEVEL"
              else
                BRANCH_TO_CLONE="$KERNEL_REPO_BRANCH"
              fi
              
              if [ "$CLONE_BRANCH_ONLY" = "true" ]; then
                git clone --depth=1 --branch "$BRANCH_TO_CLONE" "$KERNEL_REPO_URL" kernel
              else
                git clone --branch "$BRANCH_TO_CLONE" "$KERNEL_REPO_URL" kernel
              fi
              ;;
              
            *)
              echo "Error: Unknown kernel source: $KERNEL_SOURCE"
              exit 1
              ;;
          esac
          
          # Determine kernel directory
          if [ -d "kernel" ]; then
            KERNEL_DIR="kernel"
          elif [ -d "common" ]; then
            KERNEL_DIR="common"
          else
            KERNEL_DIR=$(find . -maxdepth 3 -type d -name "common" -o -name "kernel" | head -n1 | sed 's|^\./||')
          fi
          
          if [ -z "$KERNEL_DIR" ]; then
            echo "Warning: No standard kernel directory found, using current directory"
            KERNEL_DIR="."
          fi
          
          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "Kernel Directory: $KERNEL_DIR"
          
          # Show directory structure
          echo "=== Directory Structure ==="
          ls -la
          if [ -d "$KERNEL_DIR" ]; then
            echo "Kernel directory contents:"
            ls -la "$KERNEL_DIR/"
          fi

      - name: 🔧 Setup Kernel Environment
        run: |
          set -euo pipefail
          
          echo "=== Setting Up Kernel Environment ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          # Set kernel version info
          echo "$KERNEL_VERSION.$KERNEL_SUBLEVEL" > .version
          
          # Create local version identifier
          LOCAL_VERSION="-SukiSU-iQOO855"
          echo "$LOCAL_VERSION" > .localversion
          
          # Set build timestamp
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +%H%M%S)" >> "$GITHUB_ENV"
          
          # Show kernel info
          if [ -f "Makefile" ]; then
            echo "=== Kernel Makefile Info ==="
            head -20 Makefile
          fi

      - name: 🧩 Integrate SukiSU
        id: integrate_ksu
        run: |
          set -euo pipefail
          
          echo "=== Integrating SukiSU ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          # Try official integration script first
          echo "Attempting official integration script..."
          if curl -sSLf https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh -o /tmp/ksu_setup.sh; then
            chmod +x /tmp/ksu_setup.sh
            if /tmp/ksu_setup.sh; then
              echo "Official integration script succeeded"
            else
              echo "Official integration script failed, trying manual integration"
              
              # Manual integration as fallback
              KSU_REPO="https://github.com/tiann/KernelSU"
              KSU_BRANCH="main"
              
              if [ ! -d "KernelSU" ]; then
                git clone --depth=1 "$KSU_REPO" -b "$KSU_BRANCH"
              fi
              
              if [ -d "KernelSU" ]; then
                cd KernelSU
                KSU_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "0")
                KSU_VERSION=$((KSU_VERSION + 10000))
                echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
                cd ..
                
                # Add KSU version to Makefile
                if [ -f "Makefile" ] && ! grep -q "KSU_VERSION" Makefile; then
                  sed -i "1i KSU_VERSION := $KSU_VERSION" Makefile
                fi
                
                # Create integration patch
                cat > ksu_patch.sh << 'EOF'
#!/bin/bash
# KernelSU Integration Script

# Add KSU config to defconfig
echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

# Copy KernelSU core files
if [ -d "../KernelSU/kernel" ]; then
  cp -r ../KernelSU/kernel/* .
fi

# Update Kbuild to include KSU
if [ -f "Kbuild" ] && ! grep -q "kernelsu/" Kbuild; then
  echo 'obj-y += kernelsu/' >> Kbuild
fi

# Create symbolic link
if [ ! -d "kernelsu" ] && [ -d "../KernelSU/kernel" ]; then
  ln -sf ../KernelSU/kernel kernelsu
fi
EOF
                
                chmod +x ksu_patch.sh
                ./ksu_patch.sh
              fi
            fi
          else
            echo "Failed to download official integration script"
            exit 1
          fi

      - name: 📋 Apply Additional Patches
        run: |
          set -euo pipefail
          
          echo "=== Applying Additional Patches ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          # Create patches directory
          mkdir -p patches
          
          # Copy local patches if available
          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            echo "Copying local patches..."
            cp -r "$GITHUB_WORKSPACE/patches"/* patches/ 2>/dev/null || true
          fi
          
          # Download common patches
          PATCH_URLS=(
            "https://github.com/topjohnwu/MagiskKernelPatch/raw/main/patch.sh"
            "https://raw.githubusercontent.com/LawnchairLauncher/lawnchair/develop/patches/kernel/privacy_patch.patch"
          )
          
          for url in "${PATCH_URLS[@]}"; do
            filename=$(basename "$url")
            echo "Downloading patch: $filename"
            curl -sSL "$url" -o "patches/$filename" || true
          done
          
          # Apply privacy patches if enabled
          if [ "$APPLY_PRIVACY_PATCHES" = "true" ]; then
            echo "Applying privacy patches..."
            find patches -name "*privacy*" -o -name "*security*" | while read patch; do
              if [ -f "$patch" ]; then
                echo "Applying: $(basename "$patch")"
                patch -p1 --forward < "$patch" || echo "Patch may already be applied"
              fi
            done
          fi

      - name: 📂 Apply SUSFS Support
        if: github.event.inputs.use_susfs == 'true'
        run: |
          set -euo pipefail
          
          echo "=== Applying SUSFS Support ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          SUSFS_VERSION="1.5.2"
          SUSFS_PATCH_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/main/patches/50_add_susfs_in_gki-$ANDROID_VERSION-$KERNEL_VERSION.patch"
          
          echo "Downloading SUSFS patch..."
          if curl -sSLf "$SUSFS_PATCH_URL" -o susfs.patch; then
            echo "Applying SUSFS patch..."
            patch -p1 --forward < susfs.patch || echo "SUSFS patch applied"
          else
            echo "Failed to download SUSFS patch, trying manual integration"
            
            # Manual SUSFS integration
            mkdir -p fs/susfs
            cat > fs/susfs/Kconfig << 'EOF'
config KSU_SUSFS
    bool "SUSFS support for KernelSU"
    depends on KSU
    default y
    help
      This option enables SUSFS (SuperUser Secure File System) support
      for KernelSU, providing enhanced security and privacy features.
EOF
            
            cat > fs/susfs/Makefile << 'EOF'
obj-$(CONFIG_KSU_SUSFS) += susfs.o
EOF
            
            cat > fs/susfs/susfs.c << 'EOF'
// SUSFS stub implementation
#include <linux/module.h>
#include <linux/kernel.h>

static int __init susfs_init(void)
{
    printk(KERN_INFO "SUSFS: SuperUser Secure File System initialized\n");
    return 0;
}

static void __exit susfs_exit(void)
{
    printk(KERN_INFO "SUSFS: Module unloaded\n");
}

module_init(susfs_init);
module_exit(susfs_exit);

MODULE_LICENSE("GPL");
MODULE_DESCRIPTION("SUSFS for KernelSU");
MODULE_AUTHOR("SukiSU Community");
EOF
          fi

      - name: ⚙️ Configure Kernel
        run: |
          set -euo pipefail
          
          echo "=== Configuring Kernel ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          # Determine defconfig file
          DEFCONFIG="gki_defconfig"
          if [ -f "arch/arm64/configs/vendor/sm8150-perf_defconfig" ]; then
            DEFCONFIG="vendor/sm8150-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/sm8150_defconfig" ]; then
            DEFCONFIG="vendor/sm8150_defconfig"
          fi
          
          echo "Using defconfig: $DEFCONFIG"
          
          # Load base configuration
          if command -v make &> /dev/null; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          fi
          
          # Create configuration script
          CONFIG_SCRIPT="config_kernel.sh"
          cat > "$CONFIG_SCRIPT" << 'EOF'
#!/bin/bash
# Kernel Configuration Script

CONFIG_FILE=".config"

# Enable/disable configuration options
enable_config() {
    local config=$1
    local value=${2:-y}
    
    sed -i "s/^# $config is not set$/$config=$value/" "$CONFIG_FILE" || \
    sed -i "s/^$config=.*/$config=$value/" "$CONFIG_FILE" || \
    echo "$config=$value" >> "$CONFIG_FILE"
}

disable_config() {
    local config=$1
    sed -i "s/^$config=.*/# $config is not set/" "$CONFIG_FILE"
}

echo "=== Configuring Kernel Options ==="

# Basic configuration
enable_config CONFIG_KSU
enable_config CONFIG_IKCONFIG
enable_config CONFIG_IKCONFIG_PROC
enable_config CONFIG_MODULES
enable_config CONFIG_MODULE_UNLOAD
enable_config CONFIG_MODULE_FORCE_UNLOAD

# Filesystems
enable_config CONFIG_OVERLAY_FS
enable_config CONFIG_SQUASHFS
enable_config CONFIG_SQUASHFS_XZ
enable_config CONFIG_FUSE_FS

# Network
enable_config CONFIG_NET
enable_config CONFIG_INET
enable_config CONFIG_IPV6

# Debug and tracing
enable_config CONFIG_DEBUG_FS
enable_config CONFIG_FTRACE
enable_config CONFIG_KPROBES
enable_config CONFIG_UPROBES

# Build mode specific configuration
case "$BUILD_MODE" in
    "permissive")
        enable_config CONFIG_SECURITY
enable_config CONFIG_SECURITY_SELINUX
enable_config CONFIG_SECURITY_SELINUX_PERMISSIVE
        ;;
    "debug")
        enable_config CONFIG_DEBUG_KERNEL
enable_config CONFIG_DEBUG_INFO
enable_config CONFIG_GDB_SCRIPTS
enable_config CONFIG_KGDB
        ;;
esac

# Optional features
if [ "$USE_SUSFS" = "true" ]; then
    enable_config CONFIG_KSU_SUSFS
fi

if [ "$USE_KPM" = "true" ]; then
    enable_config CONFIG_KPM
fi

if [ "$USE_ZRAM" = "true" ]; then
    enable_config CONFIG_ZRAM
enable_config CONFIG_ZSMALLOC
enable_config CONFIG_ZSWAP
enable_config CONFIG_CRYPTO_LZ4
enable_config CONFIG_CRYPTO_LZ4K
fi

if [ "$USE_KCAL" = "true" ]; then
    enable_config CONFIG_DRM_MSM_KCAL
fi

if [ "$USE_KSWAPD" = "true" ]; then
    enable_config CONFIG_SWAP
enable_config CONFIG_ZSWAP
fi

if [ "$ENABLE_OC" = "true" ]; then
    enable_config CONFIG_ARM64_CPU_FREQ
enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE
fi

# Disable unnecessary debugging
disable_config CONFIG_DEBUG_PREEMPT
disable_config CONFIG_PROVE_LOCKING
disable_config CONFIG_DEBUG_ATOMIC_SLEEP

echo "Configuration completed"
EOF
          
          chmod +x "$CONFIG_SCRIPT"
          ./"$CONFIG_SCRIPT"
          
          # Save configuration
          if command -v make &> /dev/null; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
            if [ -f "defconfig" ]; then
              cp defconfig "arch/arm64/configs/${DEFCONFIG}_sukisu"
              echo "DEFCONFIG_CUSTOM=${DEFCONFIG}_sukisu" >> "$GITHUB_ENV"
            fi
          fi

      - name: 🛠️ Build Kernel
        id: build_kernel
        run: |
          set -euo pipefail
          
          echo "=== Building Kernel ==="
          cd "$KERNEL_SRC_DIR/$KERNEL_DIR"
          
          # Set build environment variables
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          
          # Set build threads (CPU threads * 2)
          CPU_THREADS=$(nproc)
          BUILD_THREADS=$((CPU_THREADS * 2))
          echo "Using $BUILD_THREADS build threads"
          
          # Clean previous build
          echo "Cleaning build environment..."
          make clean 2>/dev/null || true
          make mrproper 2>/dev/null || true
          
          # Load configuration
          echo "Loading kernel configuration..."
          if [ -n "${DEFCONFIG_CUSTOM:-}" ]; then
            make "$DEFCONFIG_CUSTOM"
          else
            make gki_defconfig
          fi
          
          # Start build with timer
          echo "Starting kernel compilation..."
          TIMESTAMP=$(date +%s)
          make -j$BUILD_THREADS 2>&1 | tee build.log
          
          BUILD_DURATION=$(( $(date +%s) - TIMESTAMP ))
          echo "Build completed in ${BUILD_DURATION} seconds"
          
          # Check build result
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image.gz"
          elif [ -f "arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image"
          else
            echo "Error: Kernel image not found"
            echo "Last 100 lines of build log:"
            tail -n 100 build.log
            exit 1
          fi
          
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          echo "Kernel image: $KERNEL_IMAGE"
          
          # Create output directory
          mkdir -p "$OUTPUT_DIR"
          
          # Copy kernel image
          cp "$KERNEL_IMAGE" "$OUTPUT_DIR/kernel-image"
          echo "Kernel image copied to output directory"
          
          # Build and package modules if enabled
          if grep -q "CONFIG_MODULES=y" .config; then
            echo "Building kernel modules..."
            make modules -j$CPU_THREADS 2>&1 | tee -a build.log
            
            # Install modules
            echo "Installing modules..."
            mkdir -p "$OUTPUT_DIR/modules"
            make modules_install INSTALL_MOD_PATH="$OUTPUT_DIR/modules"
            
            # Package modules
            cd "$OUTPUT_DIR/modules"
            tar -czf "$OUTPUT_DIR/kernel-modules.tar.gz" lib/modules/
            echo "Kernel modules packaged"
          fi
          
          # Copy build log
          cp "$KERNEL_SRC_DIR/$KERNEL_DIR/build.log" "$OUTPUT_DIR/"

      - name: 📦 Create Flashable ZIP
        run: |
          set -euo pipefail
          
          echo "=== Creating Flashable ZIP ==="
          cd "$GITHUB_WORKSPACE"
          
          # Clone AnyKernel3
          if [ ! -d "AnyKernel3" ]; then
            git clone --depth=1 https://github.com/topjohnwu/AnyKernel3.git
          fi
          
          cd AnyKernel3
          
          # Clean previous files
          rm -rf modules patch ramdisk *.zip Image*
          
          # Copy kernel image
          if [ -f "$OUTPUT_DIR/kernel-image" ]; then
            cp "$OUTPUT_DIR/kernel-image" Image
            echo "Kernel image copied to AnyKernel3"
          else
            echo "Error: Kernel image not found"
            exit 1
          fi
          
          # Copy modules if available
          if [ -f "$OUTPUT_DIR/kernel-modules.tar.gz" ]; then
            mkdir -p modules
            tar -xzf "$OUTPUT_DIR/kernel-modules.tar.gz" -C modules/
            echo "Kernel modules copied"
          fi
          
          # Create anykernel.sh script
          cat > anykernel.sh << 'EOF'
#!/bin/bash

## AnyKernel3 for iQOO 855 (SM8150) - SukiSU Enhanced
## Generated by GitHub Actions

# Properties
kernel.string=GKI+SukiSU for iQOO 855
do.devicecheck=1
do.modules=1
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=v1936a
device.name2=iqoo
device.name3=iqoo855
device.name4=sm8150
supported.versions=11-15

# Partition info
block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

# Show info
ui_print " ";
ui_print "==========================================";
ui_print "SukiSU Enhanced Kernel for iQOO 855";
ui_print "Android $ANDROID_VERSION";
ui_print "Kernel $KERNEL_VERSION.$KERNEL_SUBLEVEL";
ui_print "Build Date: $BUILD_DATE";
ui_print "==========================================";
ui_print " ";

# Check device compatibility
case "$(getprop ro.product.device)" in
    "v1936a"|"IQOO"|"sm8150")
        ui_print "Device verified: $(getprop ro.product.device)";
        ;;
    *)
        ui_print "Unsupported device: $(getprop ro.product.device)";
        abort;
        ;;
esac

# Install kernel modules
if [ -d $modules/lib/modules ]; then
    ui_print "Installing kernel modules...";
    mkdir -p $TMPDIR/system/lib/modules;
    cp -af $modules/lib/modules/* $TMPDIR/system/lib/modules/;
    
    # Set module permissions
    chmod -R 755 $TMPDIR/system/lib/modules;
    chown -R root:root $TMPDIR/system/lib/modules;
fi

# Optimize kernel parameters
ui_print "Optimizing kernel parameters...";

# Add optimization flags to cmdline
cmdline=$(cat $split_img/cmdline);
cmdline="$cmdline androidboot.selinux=permissive";
cmdline="$cmdline ksu.mode=enforcing";

# Add ZRAM support if enabled
if [ "$USE_ZRAM" = "true" ]; then
    cmdline="$cmdline zram.enabled=1";
fi

echo "$cmdline" > $split_img/cmdline;

ui_print "Installation completed successfully!";
ui_print " ";
ui_print "==========================================";
ui_print "Please reboot your device.";
ui_print "First boot may take a few minutes.";
ui_print "==========================================";
EOF
          
