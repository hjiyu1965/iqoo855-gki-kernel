name: Build Kernel

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Kernel
      uses: mlm-games/simple-kernel-build-action@v1.1.0
      with:
        KERNEL_CLONE_CMD: 'git clone https://github.com/hjiyu1965/android_kernel_nabu_sm8150-ac -b main' # PSA: directory and depth=1 are added automatically!
        KERNEL_CONFIG: 'vranchu64_defconfig'
        ARCH: 'arm64'
        TOOLCHAIN_CLONE_CMD: 'git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/e532342f30eadb954c96d19ca6a0edf89a5c65bc/clang-r383902/ ./toolchain/gcc'
        ENABLE_KSU: 'false'
        ENABLE_CCACHE: 'true'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: 'kernel_source/flashable-anykernel.zip' # Always named flashable-anykernel.zip
