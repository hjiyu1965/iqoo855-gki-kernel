BUILD_MODE=$BUILD_MODE
ENABLE_FEATURES="SukiSU${USE_SUSFS:+ SUSFS}${USE_KPM:+ KPM}${USE_ZRAM:+ ZRAM}${ENABLE_OC:+ Overclock}"
EOF
          
          # Create flashable ZIP
          ZIP_NAME="SukiSU-iQOO855-${ANDROID_VERSION}-${KERNEL_VERSION}.${KERNEL_SUBLEVEL}-${BUILD_DATE}-${BUILD_MODE}.zip"
