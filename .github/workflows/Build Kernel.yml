name: Build SM8150 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      KERNEL_VERSION:
        description: '内核版本'
        required: true
        default: '4.14.190-perf+'
      KERNELSU_VERSION:
        description: 'KernelSU版本 (如 main, v0.5.2)'
        required: true
        default: 'main'
      BUILD_MODE:
        description: '构建模式'
        required: true
        type: choice
        default: 'release'
        options:
          - 'release'
          - 'debug'
          - 'permissive'


jobs:
  build-kernel:
    name: Build SM8150 Kernel with KernelSU
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
      KERNELSU_VERSION: ${{ github.event.inputs.KERNELSU_VERSION }}
      BUILD_MODE: ${{ github.event.inputs.BUILD_MODE }}
      KERNEL_SRC_DIR: "${{ github.workspace }}/kernel-src"
      OUTPUT_DIR: "${{ github.workspace }}/output"
      GOOGLE_KERNEL_REPO: "https://android.googlesource.com/kernel/manifest"
      GOOGLE_KERNEL_BRANCH: "common-android13-4.14"
      CCACHE_DIR: "${{ github.workspace }}/.ccache"

    steps:
      - name: 📋 Check Workflow Inputs
        run: |
          echo "=== Workflow Inputs ==="
          echo "Kernel Version: $KERNEL_VERSION"
          echo "KernelSU Version: $KERNELSU_VERSION"
          echo "Build Mode: $BUILD_MODE"
          echo "========================"

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Clean and Optimize Environment
        run: |
          # Clean system package cache
          sudo apt clean
          sudo apt autoremove -y --purge
          
          # Remove large unused packages
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          
          # Show disk and memory usage
          echo "=== System Status ==="
          df -h
          free -h

      - name: 📦 Setup Build Dependencies
        run: |
          set -euo pipefail
          
          echo "=== Installing Build Dependencies ==="
          
          # Update package list
          sudo apt-get update -y
          
          # Install core dependencies for kernel build
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev liblz4-tool lz4 rsync device-tree-compiler \
            gcc-aarch64-linux-gnu clang-14 lld-14 llvm-14 \
            git git-lfs curl wget unzip aria2 ccache \
            python3 python3-pip xxd
          
          # Install repo tool
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          
          # Show tool versions
          echo "=== Tool Versions ==="
          clang-14 --version || true
          gcc-aarch64-linux-gnu --version || true
          repo --version
          make --version
          python3 --version

      - name: 💾 Setup CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ env.KERNEL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-

      - name: 📥 Fetch Google Official Kernel Source
        run: |
          set -euo pipefail
          
          echo "=== Fetching Google Official Kernel Source ==="
          mkdir -p "$KERNEL_SRC_DIR"
          cd "$KERNEL_SRC_DIR"
          
          # Initialize repo with Google kernel manifest
          repo init -u "$GOOGLE_KERNEL_REPO" -b "$GOOGLE_KERNEL_BRANCH" --depth=1
          
          # Sync kernel source
          repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync
          
          # Show directory structure
          echo "=== Directory Structure ==="
          ls -la
          if [ -d "common" ]; then
            echo "Common kernel directory contents:"
            ls -la common/
          fi

      - name: 🔧 Setup KernelSU
        run: |
          set -euo pipefail
          
          echo "=== Setting Up KernelSU ==="
          cd "$KERNEL_SRC_DIR/common"
          
          # Download and run KernelSU setup script
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KERNELSU_VERSION"
          
          echo "KernelSU setup completed"

      - name: ⚙️ Configure Kernel for SM8150
        run: |
          set -euo pipefail
          
          echo "=== Configuring Kernel for SM8150 ==="
          cd "$KERNEL_SRC_DIR/common"
          
          # Set build environment variables
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-14
          export LD=ld.lld-14
          export AR=llvm-ar-14
          export NM=llvm-nm-14
          export OBJCOPY=llvm-objcopy-14
          export OBJDUMP=llvm-objdump-14
          export STRIP=llvm-strip-14
          export LLVM=1
          export LLVM_IAS=1
          
          # Use GKI defconfig as base
          make gki_defconfig
          
          # Apply SM8150 specific configuration
          cat > sm8150_config.patch << 'EOF'
CONFIG_LOCALVERSION="-SM8150-KernelSU"
CONFIG_KSU=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_DEBUG_FS=y
EOF
          
          # Apply the configuration patch
          grep -v '^#' sm8150_config.patch | while read -r line; do
            if [[ -n $line ]]; then
              echo "$line" >> .config
            fi
          done
          
          # Update configuration with olddefconfig
          make olddefconfig
          
          # Show some kernel config
          echo "=== Kernel Configuration ==="
          grep -i "ksu\|sm8150\|gki" .config

      - name: 🛠️ Build Kernel
        id: build_kernel
        run: |
          set -euo pipefail
          
          echo "=== Building Kernel ==="
          cd "$KERNEL_SRC_DIR/common"
          
          # Set build environment variables
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-14
          export LD=ld.lld-14
          export AR=llvm-ar-14
          export NM=llvm-nm-14
          export OBJCOPY=llvm-objcopy-14
          export OBJDUMP=llvm-objdump-14
          export STRIP=llvm-strip-14
          export LLVM=1
          export LLVM_IAS=1
          export LTO=thin
          
          # Enable ccache
          export CCACHE=1
          export CCACHE_COMPILERCHECK=content
          export CCACHE_COMPRESS=1
          export CCACHE_DIR="$CCACHE_DIR"
          
          # Set build threads
          CPU_THREADS=$(nproc)
          BUILD_THREADS=$((CPU_THREADS * 2))
          echo "Using $BUILD_THREADS build threads"
          
          # Clean previous build
          make clean 2>/dev/null || true
          
          # Start build with timer
          echo "Starting kernel compilation..."
          TIMESTAMP=$(date +%s)
          make -j$BUILD_THREADS 2>&1 | tee build.log
          
          BUILD_DURATION=$(( $(date +%s) - TIMESTAMP ))
          echo "Build completed in ${BUILD_DURATION} seconds"
          
          # Check build result
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image.gz"
          elif [ -f "arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image"
          else
            echo "Error: Kernel image not found"
            echo "Last 100 lines of build log:"
            tail -n 100 build.log
            exit 1
          fi
          
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          echo "Kernel image: $KERNEL_IMAGE"

      - name: 📦 Package Build Artifacts
        run: |
          set -euo pipefail
          
          echo "=== Packaging Build Artifacts ==="
          
          # Create output directory
          mkdir -p "$OUTPUT_DIR"
          
          # Copy kernel image
          cp "$KERNEL_SRC_DIR/common/$KERNEL_IMAGE" "$OUTPUT_DIR/Image.gz"
          echo "Kernel image copied to output directory"
          
          # Copy build log
          cp "$KERNEL_SRC_DIR/common/build.log" "$OUTPUT_DIR/"
          
          # Create version info
          cat > "$OUTPUT_DIR/version.txt" << EOF
Kernel Version: $KERNEL_VERSION
KernelSU Version: $KERNELSU_VERSION
Build Mode: $BUILD_MODE
Build Date: $(date)
Build Duration: ${BUILD_DURATION} seconds
EOF
          
          # Create flashable ZIP with AnyKernel3
          echo "=== Creating Flashable ZIP with AnyKernel3 ==="
          cd "${{ github.workspace }}"
          
          # Clone AnyKernel3
          git clone --depth=1 https://github.com/topjohnwu/AnyKernel3.git
          
          cd AnyKernel3
          
          # Clean previous files
          rm -rf modules patch ramdisk *.zip Image* 2>/dev/null || true
          
          # Copy kernel image
          cp "$OUTPUT_DIR/Image.gz" Image.gz
          
          # Create anykernel.sh script
          cat > anykernel.sh << 'EOF'
#!/bin/bash

## AnyKernel3 for SM8150 - KernelSU
## Generated by GitHub Actions

# Properties
kernel.string=SM8150 Kernel with KernelSU
do.devicecheck=1
do.modules=1
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=sm8150
device.name2=snapdragon855
device.name3=sd855
supported.versions=11-15

# Partition info
block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

# Show info
ui_print " ";
ui_print "==========================================";
ui_print "SM8150 Kernel with KernelSU";
ui_print "==========================================";
ui_print " ";

# Check device compatibility
case "$(getprop ro.product.board)" in
    "sm8150")
        ui_print "Device verified: sm8150";
        ;;
    *)
        ui_print "Unsupported device: $(getprop ro.product.board)";
        abort;
        ;;
esac

ui_print "Installation completed successfully!";
ui_print " ";
ui_print "==========================================";
ui_print "Please reboot your device.";
ui_print "First boot may take a few minutes.";
ui_print "==========================================";
EOF
          
          # Create flashable ZIP
          ZIP_NAME="SM8150-KernelSU-${KERNEL_VERSION}-$(date +%Y%m%d).zip"
          zip -r9 "$OUTPUT_DIR/$ZIP_NAME" . -x ".git/*" "*.git*" "README.md" "LICENSE"
          
          echo "Flashable ZIP created: $ZIP_NAME"
          echo "ZIP size: $(ls -lh "$OUTPUT_DIR/$ZIP_NAME" | awk '{print $5}')"

      - name: 📊 Generate Build Report
        run: |
          set -euo pipefail
          
          echo "=== Generating Build Report ==="
          
          # Create build report
          cat > "$OUTPUT_DIR/build_report.md" << EOF
# SM8150 Kernel with KernelSU Build Report

## Build Information
- **Build Number**: ${{ github.run_number }}
- **Build Time**: $(date)
- **Workflow**: ${{ github.workflow }}
- **Triggered By**: ${{ github.actor }}

## Configuration Parameters
- **Kernel Version**: $KERNEL_VERSION
- **KernelSU Version**: $KERNELSU_VERSION
- **Build Mode**: $BUILD_MODE

## Generated Files
EOF
          
          # Add file information
          for file in "$OUTPUT_DIR"/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              filesize=$(ls -lh "$file" | awk '{print $5}')
              echo "- **$filename**: $filesize" >> "$OUTPUT_DIR/build_report.md"
            fi
          done
          
          cat >> "$OUTPUT_DIR/build_report.md" << EOF

## Device Compatibility
- **Chipset**: Qualcomm SM8150 (Snapdragon 855)
- **Android Versions**: 11-15

## Flashing Instructions
1. Download the flashable ZIP file
2. Boot into TWRP/OrangeFox Recovery
3. Flash the ZIP file
4. Reboot system

## Notes
- First boot may take longer than usual
- Ensure bootloader is unlocked before flashing
- Backup important data before proceeding
- Report issues at ${{ github.repository }}/issues

## Build Logs
The build log is available as [build.log](build.log)
EOF
          
          echo "Build report generated successfully"

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "SM8150-KernelSU-Build-${{ github.run_number }}"
          path: "${{ env.OUTPUT_DIR }}/*"
          retention-days: 30
          compression-level: 0

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "=== Cleaning Up ==="
          # Remove large directories
          rm -rf "$KERNEL_SRC_DIR" "${{ github.workspace }}/AnyKernel3"
          echo "Cleanup completed"
