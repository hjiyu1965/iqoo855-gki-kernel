name: Android Kernel Build CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'docker/**'
      - '.github/workflows/**'
      - 'config.env'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86_64
      device:
        description: 'Target device'
        required: false
        default: 'generic_arm64'
        type: choice
        options:
          - pixel6
          - pixel5
          - pixel4
          - pixel3
          - samsung_s21
          - samsung_s20
          - xiaomi_mi11
          - xiaomi_mi10
          - oneplus_9
          - oneplus_8
          - generic_arm64
          - generic_arm
          - generic_x86_64
      kernel_branch:
        description: 'Kernel branch to build'
        required: false
        default: 'android13-5.15'
      enable_ccache:
        description: 'Enable ccache'
        required: false
        default: true
        type: boolean
      pack_artifacts:
        description: 'Pack build artifacts'
        required: false
        default: true
        type: boolean

env:
  KERNEL_SOURCE: https://android.googlesource.com/kernel/common
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build-kernel:
    name: Build Kernel (${{ matrix.arch }} - ${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            device: pixel6
            config: arch/arm64/defconfig
          - arch: arm64
            device: samsung_s21
            config: arch/arm64/defconfig
          - arch: arm64
            device: xiaomi_mi11
            config: arch/arm64/defconfig
          - arch: arm64
            device: generic_arm64
            config: arch/arm64/defconfig
          - arch: arm
            device: generic_arm
            config: arch/arm/defconfig
          - arch: x86_64
            device: generic_x86_64
            config: arch/x86_64/defconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget \
            libncurses-dev \
            bison flex \
            libssl-dev \
            libelf-dev \
            bc \
            cpio \
            kmod \
            device-tree-compiler \
            python3 \
            python3-pip \
            ccache \
            lz4 \
            lzop \
            zstd \
            jq

      - name: Install cross-compilers
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      - name: Install Clang/LLVM
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          sudo tar -xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C /opt
          sudo mv /opt/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04 /opt/clang
          rm clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          echo "/opt/clang/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.arch }}-${{ matrix.device }}
          max-size: 2G

      - name: Fetch kernel source
        run: |
          chmod +x scripts/fetch_kernel.sh
          ./scripts/fetch_kernel.sh \
            -b ${{ inputs.kernel_branch || 'android13-5.15' }} \
            -v \
            -j 4

      - name: Build kernel
        run: |
          chmod +x scripts/build.sh
          chmod +x scripts/error_handler.sh
          
          ./scripts/build.sh \
            -a ${{ matrix.arch }} \
            -d ${{ matrix.device }} \
            -c ${{ matrix.config }} \
            -j $(nproc) \
            --ccache \
            ${{ inputs.pack_artifacts != false && '--pack' || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-${{ matrix.arch }}-${{ matrix.device }}
          path: |
            output/images/
            output/modules/
            output/dtbs/
            output/packages/
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.arch }}-${{ matrix.device }}
          path: output/logs/
          retention-days: 7

      - name: Generate build report
        if: success()
        run: |
          cat > build_report.md << EOF
          # Kernel Build Report
          
          ## Build Information
          - **Architecture**: ${{ matrix.arch }}
          - **Device**: ${{ matrix.device }}
          - **Configuration**: ${{ matrix.config }}
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          
          ## Build Artifacts
          - **Kernel Image**: $(ls -lh output/images/ 2>/dev/null || echo "Not found")
          - **Modules**: $(find output/modules/ -name "*.ko" 2>/dev/null | wc -l) modules
          - **Device Trees**: $(find output/dtbs/ -name "*.dtb" 2>/dev/null | wc -l) dtbs
          - **Packages**: $(ls -lh output/packages/ 2>/dev/null || echo "Not found")
          
          ## Build Time
          - **Started**: ${{ github.event.head_commit.timestamp }}
          - **Duration**: ${{ steps.build.outputs.duration }}
          
          EOF
          cat build_report.md

      - name: Comment PR with build results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('build_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-kernel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: android-kernel-builder
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-kernel, build-docker-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archive
        run: |
          cd artifacts
          find . -type f -name "*.tar.gz" -exec cp {} . \;
          tar -czf kernel-release-${{ github.ref_name }}.tar.gz *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/kernel-release-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-build-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: build-kernel
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.build-kernel.result }}" == "success" ]; then
            echo "✅ Build successful for ${{ github.ref }}"
          else
            echo "❌ Build failed for ${{ github.ref }}"
            exit 1
          fi

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: build-kernel
    if: always()

    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          name: |
            kernel-*
            logs-*
          failOnError: false
          minAge: 30
