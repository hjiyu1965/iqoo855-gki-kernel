name: Build Android Kernel (SM8150)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: '内核源码仓库地址'
        required: true
        default: 'https://github.com/你的用户名/你的内核仓库'
      KERNEL_BRANCH:
        description: '内核源码分支'
        required: true
        default: 'master'
      DEFCONFIG:
        description: 'defconfig 文件名'
        required: true
        default: 'vendor/sm8150-perf_defconfig'
      ENABLE_KSU:
        description: '是否集成 KernelSU'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      ENABLE_LTO:
        description: '是否启用 LTO'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: GitHub-Actions
  KBUILD_BUILD_HOST: SM8150-Builder
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: ⚙️ 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            make \
            patch \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xz-utils \
            xsltproc \
            zip \
            zlib1g-dev \
            unzip \
            file

          sudo timedatectl set-timezone Asia/Shanghai || true
          echo "构建开始时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 📦 缓存 Clang 工具链
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/clang
          key: clang-proton-sm8150-v2

      - name: 🔧 下载 Clang 工具链
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchains"
          cd "${{ github.workspace }}/toolchains"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          "${{ github.workspace }}/toolchains/clang/bin/clang" --version

      - name: 📦 缓存 GCC 工具链
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/gcc
          key: gcc-aarch64-arm-android-v2

      - name: 🔧 下载 GCC 工具链
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchains/gcc"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            "${{ github.workspace }}/toolchains/gcc/aarch64"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            "${{ github.workspace }}/toolchains/gcc/arm"

      - name: 📥 拉取内核源码
        run: |
          git clone \
            --depth=1 \
            --branch "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_SOURCE }}" \
            kernel_source

          cd kernel_source
          echo "最新提交:"
          git log --oneline -1 || true
          echo "内核版本:"
          make kernelversion || true

      - name: 🩹 尝试修复常见 DTS 语法问题
        run: |
          cd kernel_source

          DTS_FILE="arch/arm64/boot/dts/18821/pm8150.dtsi"

          if [ -f "$DTS_FILE" ]; then
            echo "检测到 $DTS_FILE，尝试修复"
            sed -n '1,40p' "$DTS_FILE" || true

            sed -i '1s/^\xEF\xBB\xBF//' "$DTS_FILE" || true
            sed -i '/^[[:space:]]*;[[:space:]]*$/d' "$DTS_FILE" || true
            sed -i 's/\r$//' "$DTS_FILE" || true

            echo "修复后预览："
            sed -n '1,40p' "$DTS_FILE" || true
          else
            echo "未找到特定 DTS 文件，跳过 DTS 修复"
          fi

      - name: 🔑 集成 KernelSU
        if: github.event.inputs.ENABLE_KSU == 'true'
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          if [ -d "KernelSU" ]; then
            echo "✅ KernelSU 集成成功"
          else
            echo "❌ KernelSU 集成失败"
            exit 1
          fi

      - name: 💾 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm8150-${{ github.event.inputs.DEFCONFIG }}-${{ github.ref_name }}
          restore-keys: |
            ccache-sm8150-${{ github.event.inputs.DEFCONFIG }}-
            ccache-sm8150-

      - name: ⚡ 初始化 ccache
        run: |
          ccache -M 10G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 🛠️ 设置编译环境
        run: |
          echo "CLANG_BIN=${{ github.workspace }}/toolchains/clang/bin" >> $GITHUB_ENV
          echo "GCC64_BIN=${{ github.workspace }}/toolchains/gcc/aarch64/bin" >> $GITHUB_ENV
          echo "GCC32_BIN=${{ github.workspace }}/toolchains/gcc/arm/bin" >> $GITHUB_ENV
          echo "OUT_DIR=${{ github.workspace }}/kernel_source/out" >> $GITHUB_ENV
          echo "PATH=${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc/aarch64/bin:${{ github.workspace }}/toolchains/gcc/arm/bin:$PATH" >> $GITHUB_ENV

      - name: 📋 生成内核配置
        run: |
          cd kernel_source
          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            "${{ github.event.inputs.DEFCONFIG }}"

          if [ ! -f out/.config ]; then
            echo "❌ .config 生成失败，请检查 DEFCONFIG 是否正确"
            exit 1
          fi

          echo "✅ .config 已生成"

      - name: ⚙️ 调整配置
        run: |
          cd kernel_source

          if grep -q "CONFIG_BUILD_ARM64_DT_OVERLAY" out/.config; then
            sed -i 's/^CONFIG_BUILD_ARM64_DT_OVERLAY=.*/CONFIG_BUILD_ARM64_DT_OVERLAY=n/' out/.config || true
          else
            echo "CONFIG_BUILD_ARM64_DT_OVERLAY=n" >> out/.config || true
          fi

          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_OVERLAY_FS=y"
            } >> out/.config
          fi

          if [ "${{ github.event.inputs.ENABLE_LTO }}" = "true" ]; then
            sed -i '/CONFIG_LTO_CLANG/d' out/.config || true
            sed -i '/CONFIG_THINLTO/d' out/.config || true
            sed -i '/CONFIG_LTO_NONE/d' out/.config || true
            {
              echo "CONFIG_LTO_CLANG=y"
              echo "CONFIG_THINLTO=y"
              echo "# CONFIG_LTO_NONE is not set"
            } >> out/.config
            echo "✅ 已尝试启用 ThinLTO"
          fi

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: 🔨 编译内核
        run: |
          cd kernel_source

          echo "clang 版本:"
          clang --version || true
          echo "aarch64 gcc 版本:"
          aarch64-linux-android-gcc --version || true
          echo "arm gcc 版本:"
          arm-linux-androideabi-gcc --version || true

          echo "开始编译时间: $(date '+%Y-%m-%d %H:%M:%S')"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee "${{ github.workspace }}/build.log"

          echo "编译结束时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: ✅ 检查编译结果
        run: |
          cd kernel_source

          echo "===== boot 目录内容 ====="
          ls -lah out/arch/arm64/boot/ || true

          KERNEL_IMAGE=""
          for img in Image.gz-dtb Image.gz Image Image-dtb; do
            if [ -f "out/arch/arm64/boot/$img" ]; then
              KERNEL_IMAGE="$img"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "❌ 未找到内核镜像"
            echo "===== 构建日志最后 100 行 ====="
            tail -100 "${{ github.workspace }}/build.log" || true
            exit 1
          fi

          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> $GITHUB_ENV
          echo "✅ 找到内核镜像: $KERNEL_IMAGE"

          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            echo "HAS_DTBO=true" >> $GITHUB_ENV
            echo "✅ 找到 dtbo.img"
          else
            echo "HAS_DTBO=false" >> $GITHUB_ENV
            echo "ℹ️ 未找到 dtbo.img"
          fi

          echo "===== ccache 统计 ====="
          ccache --show-stats || true

      - name: 📦 打包 AnyKernel3
        run: |
          git clone --depth=1 \
            --branch "${{ env.ANYKERNEL_BRANCH }}" \
            "${{ env.ANYKERNEL_REPO }}" \
            AnyKernel3

          cd AnyKernel3

          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh || true
          sed -i 's/is_slot_device=0/is_slot_device=1/' anykernel.sh || true

          cp "../kernel_source/out/arch/arm64/boot/${{ env.KERNEL_IMAGE }}" ./

          if [ "${{ env.HAS_DTBO }}" = "true" ]; then
            cp ../kernel_source/out/arch/arm64/boot/dtbo.img ./
          fi

          KERNEL_NAME="Kernel-SM8150"
          [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ] && KERNEL_NAME="${KERNEL_NAME}-KSU"
          [ "${{ github.event.inputs.ENABLE_LTO }}" = "true" ] && KERNEL_NAME="${KERNEL_NAME}-LTO"

          ZIP_NAME="${KERNEL_NAME}-$(date +%Y%m%d-%H%M).zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          zip -r9 "../$ZIP_NAME" . \
            -x "*.git*" \
            -x "*README*" \
            -x "*.github*"

          echo "✅ AnyKernel3 打包完成: $ZIP_NAME"
          ls -lh "../$ZIP_NAME"

      - name: 📤 上传内核镜像
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.KERNEL_IMAGE }}
          path: kernel_source/out/arch/arm64/boot/${{ env.KERNEL_IMAGE }}
          retention-days: 7

      - name: 📤 上传 dtbo
        if: env.HAS_DTBO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbo
          path: kernel_source/out/arch/arm64/boot/dtbo.img
          retention-days: 7

      - name: 📤 上传 AnyKernel3 刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: 📤 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5

      - name: 📊 构建摘要
        if: success()
        run: |
          {
            echo "## ✅ 内核编译成功"
            echo ""
            echo "| 项目 | 内容 |"
            echo "|------|------|"
            echo "| 架构 | arm64 / SM8150 |"
            echo "| 镜像 | ${{ env.KERNEL_IMAGE }} |"
            echo "| KernelSU | ${{ github.event.inputs.ENABLE_KSU }} |"
            echo "| LTO | ${{ github.event.inputs.ENABLE_LTO }} |"
            echo "| 刷机包 | ${{ env.ZIP_NAME }} |"
            echo "| 构建时间 | $(date '+%Y-%m-%d %H:%M:%S') |"
          } >> $GITHUB_STEP_SUMMARY
