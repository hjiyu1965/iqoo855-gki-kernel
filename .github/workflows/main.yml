name: Build GKI Kernel with SukiSU for iQOO 855

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android版本 (查看手机设置)'
        required: true
        type: choice
        default: 'android13'
        options:
          - 'android12'
          - 'android13'
          - 'android14'
      kernel_version:
        description: '内核主版本 (必须准确，通过 adb shell uname -r 获取)'
        required: true
        type: choice
        default: '5.10'
        options:
          - '4.14'
          - '4.19'
          - '5.4'
          - '5.10'
          - '5.15'
      kernel_sublevel:
        description: '内核子版本 (如 4.14.199+ 则填写 199)'
        required: true
        type: string
        default: '199'
      security_patch:
        description: '安全补丁日期 (格式: YYYY-MM-DD，必须与手机一致)'
        required: true
        type: string
        default: '2024-01-05'
      use_susfs:
        description: '启用SUSFS文件系统 (首次构建建议关闭)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用KPM内核模块'
        required: true
        type: boolean
        default: true
      use_zram:
        description: '启用ZRAM增强算法'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 安装完整依赖
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git-core git-lfs repo python3 python3-pip \
            build-essential bc bison flex libssl-dev libncurses-dev libelf-dev \
            lz4 rsync device-tree-compiler wget curl gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi clang lld llvm liblz4-tool aria2 \
            libxml2-utils kmod cpio git-lfs
          # 配置git-lfs
          git lfs install

      - name: 安装repo工具
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/
          repo --version

      - name: 显示构建参数
        run: |
          echo "=== 构建参数 ==="
          echo "Android版本: ${{ github.event.inputs.android_version }}"
          echo "内核版本: ${{ github.event.inputs.kernel_version }}"
          echo "内核子版本: ${{ github.event.inputs.kernel_sublevel }}"
          echo "安全补丁: ${{ github.event.inputs.security_patch }}"
          echo "启用SUSFS: ${{ github.event.inputs.use_susfs }}"
          echo "启用KPM: ${{ github.event.inputs.use_kpm }}"
          echo "启用ZRAM: ${{ github.event.inputs.use_zram }}"

      - name: 同步AOSP GKI内核源码
        run: |
          mkdir -p aosp-kernel && cd aosp-kernel
          
          # 重要：AOSP GKI内核分支命名可能不同，这里尝试多种格式
          # SM8150对应的平台代号可能是 "msm-4.14" 或 "msm-5.4"
          BRANCH_ATTEMPTS=(
            "android-${{ github.event.inputs.kernel_version }}"
            "android-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}"
            "msm-${{ github.event.inputs.kernel_version }}"
          )
          
          for BRANCH in "${BRANCH_ATTEMPTS[@]}"; do
            echo "尝试分支: $BRANCH"
            if repo init -u https://android.googlesource.com/kernel/manifest -b $BRANCH --depth=1 2>&1 | grep -q "fatal"; then
              echo "分支 $BRANCH 不存在，尝试下一个..."
              continue
            else
              echo "成功找到分支: $BRANCH"
              export SELECTED_BRANCH="$BRANCH"
              break
            fi
          done
          
          if [ -z "$SELECTED_BRANCH" ]; then
            echo "错误：未找到合适的内核分支，请检查版本组合"
            exit 1
          fi
          
          echo "使用分支: $SELECTED_BRANCH"
          repo sync -c -j$(nproc) --no-tags --fail-fast
          echo "源码同步完成"

      - name: 集成SukiSU Ultra
        run: |
          cd aosp-kernel
          # 进入内核源码目录（通常是 common/ 或 kernel/）
          if [ -d "common" ]; then
            cd common
          elif [ -d "kernel" ]; then
            cd kernel
          else
            echo "未找到内核源码目录"
            exit 1
          fi
          
          # 集成SukiSU
          echo "正在集成SukiSU..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          
          # 获取KSU版本
          cd KernelSU 2>/dev/null || cd ../KernelSU 2>/dev/null
          if [ -d "kernel" ]; then
            KSU_VERSION=$(expr $(git rev-list --count HEAD) "+" 10600)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSU版本: $KSU_VERSION"
          fi

      - name: 应用SUSFS补丁 (可选)
        if: ${{ github.event.inputs.use_susfs == 'true' }}
        run: |
          echo "准备应用SUSFS补丁..."
          
          # 下载补丁仓库
          SUSFS_BRANCH="gki-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}"
          echo "尝试SUSFS分支: $SUSFS_BRANCH"
          
          cd aosp-kernel
          KERNEL_DIR=$(find . -name "Kconfig" -type f | head -1 | xargs dirname)
          cd "$KERNEL_DIR"
          
          # 下载补丁
          wget -q "https://gitlab.com/simonpunk/susfs4ksu/-/raw/$SUSFS_BRANCH/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}.patch" || \
          wget -q "https://raw.githubusercontent.com/zzh20188/GKI_KernelSU_SUSFS/main/susfs/50_add_susfs_in_gki-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}.patch"
          
          if [ -f "*.patch" ]; then
            patch -p1 < *.patch || echo "补丁应用可能失败，但继续构建..."
            echo "SUSFS补丁应用完成"
          else
            echo "警告：未找到SUSFS补丁，继续构建..."
          fi

      - name: 配置内核
        run: |
          cd aosp-kernel
          if [ -d "common" ]; then
            cd common
          elif [ -d "kernel" ]; then
            cd kernel
          fi
          
          # 使用GKI默认配置
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          
          # 启用KernelSU
          ./scripts/config --enable CONFIG_KSU
          
          # 启用KPM（如果选择）
          if [ "${{ github.event.inputs.use_kpm }}" = "true" ]; then
            ./scripts/config --enable CONFIG_KPM 2>/dev/null || echo "CONFIG_KPM可能不存在，跳过"
          fi
          
          # 启用SUSFS配置
          if [ "${{ github.event.inputs.use_susfs }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          fi
          
          # 启用ZRAM配置
          if [ "${{ github.event.inputs.use_zram }}" = "true" ]; then
            ./scripts/config --enable CONFIG_ZRAM
            ./scripts/config --enable CONFIG_ZSMALLOC
            echo "CONFIG_CRYPTO_LZ4=y" >> arch/arm64/configs/gki_defconfig
          fi
          
          # 保存配置
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
          cp defconfig arch/arm64/configs/gki_defconfig
          
          echo "内核配置完成"

      - name: 编译内核
        run: |
          cd aosp-kernel
          if [ -d "common" ]; then
            cd common
          elif [ -d "kernel" ]; then
            cd kernel
          fi
          
          echo "开始编译内核，使用 $(nproc) 个线程..."
          
          # 方法1：尝试标准make编译
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld \
            -j$(nproc) 2>&1 | tee build.log || {
              echo "标准编译失败，尝试替代方法..."
              # 方法2：尝试使用build.sh（如果存在）
              if [ -f "build/build.sh" ]; then
                BUILD_CONFIG=./build.config.gki.aarch64 ./build/build.sh
              else
                echo "编译失败，请检查日志"
                exit 1
              fi
            }
          
          # 检查编译产物
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/Image.gz
            echo "编译成功: Image.gz"
          elif [ -f "arch/arm64/boot/Image" ]; then
            cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image
            echo "编译成功: Image"
          else
            echo "错误：未找到内核映像文件"
            ls -la arch/arm64/boot/
            exit 1
          fi

      - name: 准备AnyKernel3刷机包
        run: |
          echo "准备AnyKernel3刷机包..."
          
          # 克隆AnyKernel3
          git clone https://github.com/topjohnwu/AnyKernel3.git --depth=1
          
          # 复制内核映像
          if [ -f "$GITHUB_WORKSPACE/Image.gz" ]; then
            cp $GITHUB_WORKSPACE/Image.gz AnyKernel3/Image.gz
            cd AnyKernel3
            gzip -d Image.gz
          elif [ -f "$GITHUB_WORKSPACE/Image" ]; then
            cp $GITHUB_WORKSPACE/Image AnyKernel3/Image
            cd AnyKernel3
          fi
          
          # 创建iQOO 855专用的anykernel.sh脚本
          cat > anykernel.sh << 'EOF'
#!/bin/bash
# AnyKernel3 for iQOO 855 (SM8150) - GKI with SukiSU
# 注意：刷机前请务必备份原厂boot和vendor_boot分区！

kernel.string=GKI+SukiSU for iQOO 855
do.devicecheck=0
do.modules=1
do.systemless=1
do.cleanup=1
device.name1=v1936a  # iQOO 855设备代号
device.name2=IQOO855
device.name3=
device.name4=
device.name5=

block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

## 导入AnyKernel3核心函数
. tools/ak3-core.sh;

## 安装引导映像
dump_boot;
write_boot;

## 结束安装
EOF
          
          chmod +x anykernel.sh
          
          # 下载SUSFS模块（如果启用）
          if [ "${{ github.event.inputs.use_susfs }}" = "true" ]; then
            echo "下载SUSFS模块..."
            wget -q https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip -O ksu_module_susfs.zip
            mkdir -p modules
            unzip -j ksu_module_susfs.zip -d modules/ 2>/dev/null || echo "SUSFS模块解压失败或不存在"
          fi
          
          # 创建说明文件
          cat > README.md << 'EOF'
# iQOO 855 GKI+SukiSU 内核刷机包

## 重要提示
1. **务必备份**：刷机前请在Recovery中备份 boot 和 vendor_boot 分区！
2. **驱动缺失**：此包仅包含通用GKI内核，不包含设备专用驱动。
3. **整合驱动**：请从你的手机中提取 /vendor/lib/modules/ 下的 .ko 文件，放入此包的 modules/ 目录后重新打包。

## 构建信息
- Android版本: ${{ github.event.inputs.android_version }}
- 内核版本: ${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.kernel_sublevel }}
- 安全补丁: ${{ github.event.inputs.security_patch }}
- SukiSU版本: ${{ env.KSUVER || '未知' }}
- 构建时间: $(date)

## 刷机方法
1. 进入Recovery模式
2. 刷入此ZIP包
3. 重启系统
EOF

          # 打包
          ZIP_NAME="iQOO855_GKI_${{ github.event.inputs.android_version }}_${{ github.event.inputs.kernel_version }}_${{ env.KSUVER || 'custom' }}.zip"
          zip -r9 "$ZIP_NAME" ./* -x ".git/*" "*.git*"
          
          # 移动到工作区根目录
          mv "$ZIP_NAME" $GITHUB_WORKSPACE/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iQOO855-Kernel-Build-${{ github.run_number }}
          path: |
            *.zip
            aosp-kernel/**/build.log
            Image*
          retention-days: 7

      - name: 构建完成通知
        run: |
          echo "========================================"
          echo "✅ 内核构建完成!"
          echo "📦 刷机包: iQOO855_GKI_*.zip"
          echo "⚠️  重要: 此包不含设备驱动!"
          echo "🔧 请从你的iQOO 855提取驱动模块并整合"
          echo "========================================"
