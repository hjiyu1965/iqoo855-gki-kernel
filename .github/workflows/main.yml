#!/bin/bash
# AnyKernel3 核心函数简化版

OUTFD=$1;
UI_PRINT() { echo -e "ui_print $1\nui_print" > /proc/self/fd/$OUTFD; }
PROGRESS() { echo "progress $1 $2" > /proc/self/fd/$OUTFD; }
SETPROGRESS() { echo "set_progress $1" > /proc/self/fd/$OUTFD; }

dump_boot() {
    dd if=$block of=$TMPDIR/boot.img;
    split_boot;
}

split_boot() {
    mkdir -p $split_img;
    python3 $bin/unpackbootimg -i $TMPDIR/boot.img -o $split_img;
}

write_boot() {
    flash_boot;
}

flash_boot() {
    dd if=$TMPDIR/new-boot.img of=$block;
}
EOF
          
