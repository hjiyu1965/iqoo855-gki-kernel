# Build GKI Kernel with SukiSU for iQOO 855 (Enhanced Multi-Source Version)
name: Build GKI Kernel with SukiSU for iQOO 855

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android版本'
        required: true
        type: choice
        default: 'android13'
        options:
          - 'android12'
          - 'android13'
          - 'android14'
          - 'android15'
      kernel_version:
        description: '内核主版本'
        required: true
        type: choice
        default: '4.14'
        options:
          - '4.14'
          - '5.4'
          - '5.10'
          - '5.15'
      kernel_sublevel:
        description: '内核子版本 (如 199)'
        required: true
        type: string
        default: '199'
      security_patch:
        description: '安全补丁日期 (YYYY-MM-DD)'
        required: true
        type: string
        default: '2024-01-05'
      kernel_source:
        description: '内核源码来源'
        required: true
        type: choice
        default: 'aosp'
        options:
          - 'aosp'
          - 'lineageos'
          - 'arrowos'
          - 'custom_repo'
      kernel_repo_url:
        description: '自定义内核仓库地址 (当选择custom_repo时使用)'
        required: false
        type: string
        default: 'https://github.com/torvalds/linux'
      kernel_repo_branch:
        description: '自定义内核分支 (当选择custom_repo时使用)'
        required: false
        type: string
        default: 'v4.14'
      use_susfs:
        description: '启用SUSFS文件系统'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: '启用KPM内核模块'
        required: true
        type: boolean
        default: true
      use_zram:
        description: '启用ZRAM增强算法'
        required: true
        type: boolean
        default: false
      use_kcal:
        description: '启用KCAL色彩控制'
        required: false
        type: boolean
        default: false
      use_kswapd:
        description: '启用改进的KSWAPD'
        required: false
        type: boolean
        default: true
      clone_branch_only:
        description: '仅克隆指定分支 (减少体积)'
        required: false
        type: boolean
        default: true
      apply_privacy_patches:
        description: '应用隐私保护补丁'
        required: false
        type: boolean
        default: true
      enable_oc:
        description: '启用超频支持'
        required: false
        type: boolean
        default: false
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        default: 'gki'
        options:
          - 'gki'
          - 'permissive'
          - 'debug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    # 暴露所有输入为环境变量
    env:
      ANDROID_VERSION: ${{ github.event.inputs.android_version }}
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
      KERNEL_SUBLEVEL: ${{ github.event.inputs.kernel_sublevel }}
      SECURITY_PATCH: ${{ github.event.inputs.security_patch }}
      KERNEL_SOURCE: ${{ github.event.inputs.kernel_source }}
      KERNEL_REPO_URL: ${{ github.event.inputs.kernel_repo_url }}
      KERNEL_REPO_BRANCH: ${{ github.event.inputs.kernel_repo_branch }}
      USE_SUSFS: ${{ github.event.inputs.use_susfs }}
      USE_KPM: ${{ github.event.inputs.use_kpm }}
      USE_ZRAM: ${{ github.event.inputs.use_zram }}
      USE_KCAL: ${{ github.event.inputs.use_kcal }}
      USE_KSWAPD: ${{ github.event.inputs.use_kswapd }}
      CLONE_BRANCH_ONLY: ${{ github.event.inputs.clone_branch_only }}
      APPLY_PRIVACY_PATCHES: ${{ github.event.inputs.apply_privacy_patches }}
      ENABLE_OC: ${{ github.event.inputs.enable_oc }}
      BUILD_MODE: ${{ github.event.inputs.build_mode }}

    steps:
      - name: 检查仓库完整性
        run: |
          echo "工作流开始执行..."
          echo "工作空间: $GITHUB_WORKSPACE"
          echo "运行器: $RUNNER_OS"

      - name: Checkout 当前仓库（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 清理磁盘空间并优化环境
        run: |
          # 清理系统包缓存
          sudo apt clean
          sudo apt autoremove -y
          
          # 移除不需要的大型软件包
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          
          # 创建交换文件（如果内存不足）
          if [ "$(free -g | awk '/Mem:/ {print $2}')" -lt 16 ]; then
            echo "内存小于16GB，创建交换文件..."
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          
          # 显示可用磁盘空间
          df -h
          free -h

      - name: 设置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.KERNEL_SUBLEVEL }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          
          echo "更新包列表..."
          sudo apt-get update
          
          echo "安装基本依赖..."
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev liblz4-tool lz4 rsync device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-10-aarch64-linux-gnu \
            clang-14 clang-15 clang-16 lld llvm llvm-14 llvm-15 \
            git git-lfs curl wget unzip aria2 p7zip-full pigz \
            kmod cpio python3 python3-pip python3-venv xxd \
            ccache ninja-build pkg-config libgmp-dev libmpc-dev libmpfr-dev \
            libisl-dev libxml2-utils libcap-dev libaudit-dev libdw-dev \
            libunwind-dev libssl-dev libiberty-dev libnuma-dev libpci-dev \
            libbabeltrace-dev libslang2-dev libperl-dev binutils-dev \
            libbfd-dev libopcodes-dev libdebuginfod-dev zlib1g-dev \
            liblzma-dev libzstd-dev libbz2-dev libcurl4-openssl-dev \
            libarchive-dev libjson-c-dev libprocps-dev libsystemd-dev \
            linux-tools-common linux-tools-generic
          
          # 设置 git lfs
          git lfs install || true
          
          # 安装最新版 repo 工具
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          
          # 显示工具版本
          echo "=== 工具版本 ==="
          clang --version || true
          gcc-aarch64-linux-gnu --version || true
          repo --version
          make --version
          python3 --version

      - name: 显示构建参数
        run: |
          echo "=== 构建参数配置 ==="
          echo "Android版本: $ANDROID_VERSION"
          echo "内核版本: $KERNEL_VERSION"
          echo "内核子版本: $KERNEL_SUBLEVEL"
          echo "安全补丁: $SECURITY_PATCH"
          echo "内核来源: $KERNEL_SOURCE"
          echo "自定义仓库: $KERNEL_REPO_URL"
          echo "自定义分支: $KERNEL_REPO_BRANCH"
          echo "启用SUSFS: $USE_SUSFS"
          echo "启用KPM: $USE_KPM"
          echo "启用ZRAM: $USE_ZRAM"
          echo "启用KCAL: $USE_KCAL"
          echo "启用KSWAPD: $USE_KSWAPD"
          echo "仅克隆指定分支: $CLONE_BRANCH_ONLY"
          echo "应用隐私补丁: $APPLY_PRIVACY_PATCHES"
          echo "启用超频: $ENABLE_OC"
          echo "构建模式: $BUILD_MODE"
          echo "========================="

      - name: 准备内核源码（根据来源选择）
        id: kernel_source_setup
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-src"
          cd "$GITHUB_WORKSPACE/kernel-src"
          
          echo "准备内核源码，来源: $KERNEL_SOURCE"
          
          case "$KERNEL_SOURCE" in
            "aosp")
              echo "使用 AOSP 内核源码..."
              AOSP_MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
              
              # 构造分支名称
              if [ "$KERNEL_VERSION" = "4.14" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-4.14"
              elif [ "$KERNEL_VERSION" = "5.4" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-5.4"
              elif [ "$KERNEL_VERSION" = "5.10" ]; then
                BRANCH_NAME="common-$ANDROID_VERSION-5.10"
              else
                BRANCH_NAME="common-$ANDROID_VERSION-$KERNEL_VERSION"
              fi
              
              echo "尝试分支: $BRANCH_NAME"
              
              # 初始化 repo
              if [ "$CLONE_BRANCH_ONLY" = "true" ]; then
                repo init -u "$AOSP_MANIFEST_URL" -b "$BRANCH_NAME" --depth=1
              else
                repo init -u "$AOSP_MANIFEST_URL" -b "$BRANCH_NAME"
              fi
              
              # 同步源码（带重试）
              MAX_RETRIES=3
              for i in $(seq 1 $MAX_RETRIES); do
                echo "同步尝试 $i/$MAX_RETRIES..."
                if repo sync -c -j$(nproc) --no-tags --fail-fast --force-sync; then
                  echo "同步成功"
                  break
                elif [ $i -eq $MAX_RETRIES ]; then
                  echo "同步失败，达到最大重试次数"
                  exit 1
                fi
                sleep 10
              done
              ;;
              
            "lineageos")
              echo "使用 LineageOS 内核源码..."
              # LineageOS 使用不同的仓库结构
              git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150 -b lineage-$ANDROID_VERSION kernel
              ;;
              
            "arrowos")
              echo "使用 ArrowOS 内核源码..."
              git clone --depth=1 https://github.com/ArrowOS/android_kernel_qcom_sm8150 -b arrow-$ANDROID_VERSION kernel
              ;;
              
            "custom_repo")
              echo "使用自定义内核仓库..."
              if [ -z "$KERNEL_REPO_URL" ] || [ "$KERNEL_REPO_URL" = "https://github.com/torvalds/linux" ]; then
                echo "使用默认 Linux 稳定分支"
                BRANCH_TO_CLONE="v$KERNEL_VERSION.$KERNEL_SUBLEVEL"
              else
                BRANCH_TO_CLONE="$KERNEL_REPO_BRANCH"
              fi
              
              if [ "$CLONE_BRANCH_ONLY" = "true" ]; then
                git clone --depth=1 --branch "$BRANCH_TO_CLONE" "$KERNEL_REPO_URL" kernel
              else
                git clone --branch "$BRANCH_TO_CLONE" "$KERNEL_REPO_URL" kernel
              fi
              ;;
              
            *)
              echo "错误：未知的内核来源: $KERNEL_SOURCE"
              exit 1
              ;;
          esac
          
          # 查找实际的内核目录
          if [ -d "kernel" ]; then
            KERNEL_DIR="kernel"
          elif [ -d "common" ]; then
            KERNEL_DIR="common"
          elif [ -d "out" ]; then
            # 尝试查找 AOSP 结构
            KERNEL_DIR=$(find . -maxdepth 3 -type d -name "common" -o -name "kernel" | head -n1 | sed 's|^\./||')
          else
            KERNEL_DIR=$(find . -maxdepth 3 -type d -name "common" -o -name "kernel" | head -n1 | sed 's|^\./||')
          fi
          
          if [ -z "$KERNEL_DIR" ]; then
            echo "警告：未找到标准的内核目录，使用当前目录"
            KERNEL_DIR="."
          fi
          
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          echo "内核目录: $KERNEL_DIR"
          
          # 显示目录结构
          echo "=== 目录结构 ==="
          ls -la
          if [ -d "$KERNEL_DIR" ]; then
            echo "内核目录内容:"
            ls -la "$KERNEL_DIR/"
          fi

      - name: 切换到内核目录并设置环境
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          # 设置内核版本信息
          echo "$KERNEL_VERSION.$KERNEL_SUBLEVEL" > .version
          
          # 创建本地版本标识
          LOCAL_VERSION="-SukiSU-iQOO855"
          echo "$LOCAL_VERSION" > .localversion
          
          # 设置编译环境变量
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%H%M%S)" >> $GITHUB_ENV
          
          # 显示内核信息
          if [ -f "Makefile" ]; then
            echo "=== 内核 Makefile 信息 ==="
            head -20 Makefile
          fi

      - name: 集成 SukiSU 内核模块
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          echo "开始集成 SukiSU 内核模块..."
          
          # 方法1：尝试使用官方集成脚本
          echo "尝试方法1：官方集成脚本..."
          if curl -sSLf https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh -o /tmp/ksu_setup.sh; then
            chmod +x /tmp/ksu_setup.sh
            if /tmp/ksu_setup.sh; then
              echo "官方集成脚本成功"
            else
              echo "官方集成脚本失败，尝试方法2"
            fi
          fi
          
          # 方法2：手动集成
          echo "尝试方法2：手动集成..."
          KSU_REPO="https://github.com/tiann/KernelSU"
          KSU_BRANCH="main"
          
          # 克隆 KernelSU
          if [ ! -d "KernelSU" ]; then
            git clone --depth=1 "$KSU_REPO" -b "$KSU_BRANCH"
          fi
          
          if [ -d "KernelSU" ]; then
            cd KernelSU
            
            # 获取最新提交数作为版本
            KSU_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "0")
            KSU_VERSION=$((KSU_VERSION + 10000))
            echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
            
            # 返回内核目录
            cd ..
            
            # 在 Makefile 中添加 KernelSU 选项
            if [ -f "Makefile" ]; then
              if ! grep -q "KSU_VERSION" Makefile; then
                echo "添加 KernelSU 版本到 Makefile..."
                sed -i "1i KSU_VERSION := $KSU_VERSION" Makefile
              fi
            fi
            
            # 创建集成补丁文件
            cat > ksu_patch.sh << 'EOF'
#!/bin/bash
# KernelSU 集成补丁

# 1. 添加 KSU 配置到 defconfig
echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

# 2. 复制 KernelSU 核心文件
if [ -d "../KernelSU/kernel" ]; then
  cp -r ../KernelSU/kernel/* .
fi

# 3. 修改内核构建系统以包含 KSU
if [ -f "Kbuild" ]; then
  if ! grep -q "KernelSU" Kbuild; then
    echo 'obj-y += kernelsu/' >> Kbuild
  fi
fi

# 创建 kernelsu 目录链接
if [ ! -d "kernelsu" ] && [ -d "../KernelSU/kernel" ]; then
  ln -sf ../KernelSU/kernel kernelsu
fi
EOF
            
            chmod +x ksu_patch.sh
            ./ksu_patch.sh || echo "KSU 补丁应用完成"
            
            echo "KernelSU 集成完成，版本: $KSU_VERSION"
          else
            echo "警告：无法克隆 KernelSU 仓库"
          fi

      - name: 复制和应用支线补丁
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          echo "开始处理支线补丁..."
          
          # 创建补丁目录
          mkdir -p patches
          
          # 1. 复制仓库中的补丁（如果存在）
          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            echo "复制本地补丁..."
            cp -r "$GITHUB_WORKSPACE/patches"/* ./patches/ 2>/dev/null || true
          fi
          
          # 2. 下载常用支线补丁
          PATCH_URLS=(
            "https://github.com/topjohnwu/MagiskKernelPatch/raw/main/patch.sh"
            "https://raw.githubusercontent.com/LawnchairLauncher/lawnchair/develop/patches/kernel/privacy_patch.patch"
            "https://raw.githubusercontent.com/kdrag0n/proton_z4g/lineage-18.1/patches/security/privacy-enhancements.patch"
          )
          
          for url in "${PATCH_URLS[@]}"; do
            filename=$(basename "$url")
            echo "下载补丁: $filename"
            curl -sSL "$url" -o "patches/$filename" || true
          done
          
          # 3. 应用隐私保护补丁（如果启用）
          if [ "$APPLY_PRIVACY_PATCHES" = "true" ]; then
            echo "应用隐私保护补丁..."
            
            # 查找隐私相关补丁
            find patches -name "*privacy*" -o -name "*security*" | while read patch; do
              if [ -f "$patch" ]; then
                echo "应用补丁: $(basename "$patch")"
                patch -p1 --forward < "$patch" || echo "补丁可能已应用或部分失败"
              fi
            done
          fi
          
          # 4. 应用性能补丁
          echo "应用性能优化补丁..."
          
          # CPU 调度优化
          cat > patches/cpu_sched_optimize.patch << 'EOF'
--- a/kernel/sched/fair.c
+++ b/kernel/sched/fair.c
@@ -1234,6 +1234,10 @@
 #ifdef CONFIG_CFS_BANDWIDTH
 	int i;
 #endif
+	
+	/* 降低迁移成本阈值 */
+	sysctl_sched_migration_cost = 100000;
+	sysctl_sched_nr_migrate = 16;
 
 	raw_spin_lock_init(&cfs_rq->lock);
EOF
          
          patch -p1 < patches/cpu_sched_optimize.patch || true
          
          # 5. 应用超频补丁（如果启用）
          if [ "$ENABLE_OC" = "true" ]; then
            echo "应用超频支持补丁..."
            
            cat > patches/overclock.patch << 'EOF'
--- a/arch/arm64/boot/dts/qcom/sm8150.dtsi
+++ b/arch/arm64/boot/dts/qcom/sm8150.dtsi
@@ -100,7 +100,7 @@
 
 			opp-300000000 {
 				opp-hz = /bits/ 64 <300000000>;
-				opp-microvolt = <648000>;
+				opp-microvolt = <650000>;
 			};
 
 			opp-576000000 {
EOF
            
            patch -p1 < patches/overclock.patch || true
          fi
          
          echo "支线补丁处理完成"

      - name: 应用 SUSFS 文件系统支持
        if: ${{ github.event.inputs.use_susfs }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          echo "应用 SUSFS 文件系统支持..."
          
          # 方法1：尝试从 GitLab 获取补丁
          SUSFS_VERSION="1.5.2"
          SUSFS_PATCH_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/main/patches/50_add_susfs_in_gki-$ANDROID_VERSION-$KERNEL_VERSION.patch"
          
          echo "下载 SUSFS 补丁..."
          if curl -sSLf "$SUSFS_PATCH_URL" -o susfs.patch; then
            echo "应用 SUSFS 补丁..."
            patch -p1 --forward < susfs.patch || echo "SUSFS 补丁应用完成"
          else
            echo "无法下载 SUSFS 补丁，尝试手动集成..."
            
            # 方法2：手动创建 SUSFS 支持
            mkdir -p fs/susfs
            cat > fs/susfs/Kconfig << 'EOF'
config KSU_SUSFS
	bool "SUSFS support for KernelSU"
	depends on KSU
	default y
	help
	  This option enables SUSFS (SuperUser Secure File System) support
	  for KernelSU, providing enhanced security and privacy features.

config KSU_SUSFS_SUS_MOUNT
	bool "SUSFS mount support"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SUS_PATH
	bool "SUSFS path support"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SPOOF_UNAME
	bool "SUSFS uname spoofing"
	depends on KSU_SUSFS
	default y
EOF
            
            cat > fs/susfs/Makefile << 'EOF'
obj-$(CONFIG_KSU_SUSFS) += susfs.o
EOF
            
            cat > fs/susfs/susfs.c << 'EOF'
// SUSFS stub implementation
#include <linux/module.h>
#include <linux/kernel.h>

static int __init susfs_init(void)
{
    printk(KERN_INFO "SUSFS: SuperUser Secure File System initialized\n");
    return 0;
}

static void __exit susfs_exit(void)
{
    printk(KERN_INFO "SUSFS: Module unloaded\n");
}

module_init(susfs_init);
module_exit(susfs_exit);

MODULE_LICENSE("GPL");
MODULE_DESCRIPTION("SUSFS for KernelSU");
MODULE_AUTHOR("SukiSU Community");
EOF
          fi
          
          echo "SUSFS 支持已添加"

      - name: 配置内核编译选项
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          echo "配置内核编译选项..."
          
          # 确定 defconfig 文件
          if [ -f "arch/arm64/configs/vendor/sm8150-perf_defconfig" ]; then
            DEFCONFIG="vendor/sm8150-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/sm8150_defconfig" ]; then
            DEFCONFIG="vendor/sm8150_defconfig"
          elif [ -f "arch/arm64/configs/gki_defconfig" ]; then
            DEFCONFIG="gki_defconfig"
          else
            DEFCONFIG="defconfig"
          fi
          
          echo "使用 defconfig: $DEFCONFIG"
          
          # 复制 defconfig 为工作副本
          cp "arch/arm64/configs/$DEFCONFIG" .config
          
          # 加载基本配置
          if command -v make >/dev/null 2>&1; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          fi
          
          # 交互式配置（通过脚本）
          CONFIG_SCRIPT="config.sh"
          
          cat > $CONFIG_SCRIPT << 'EOF'
#!/bin/bash
# 内核配置脚本

CONFIG_FILE=".config"

# 启用必要模块
enable_config() {
    local config=$1
    local value=$2
    
    sed -i "s/^# $config is not set$/$config=$value/" "$CONFIG_FILE" || \
    sed -i "s/^$config=.*$/$config=$value/" "$CONFIG_FILE" || \
    echo "$config=$value" >> "$CONFIG_FILE"
}

# 禁用配置
disable_config() {
    local config=$1
    sed -i "s/^$config=.*$/# $config is not set/" "$CONFIG_FILE"
}

echo "开始配置内核选项..."

# 基本配置
enable_config "CONFIG_KSU" "y"
enable_config "CONFIG_IKCONFIG" "y"
enable_config "CONFIG_IKCONFIG_PROC" "y"
enable_config "CONFIG_MODULES" "y"
enable_config "CONFIG_MODULE_UNLOAD" "y"
enable_config "CONFIG_MODULE_FORCE_UNLOAD" "y"

# 文件系统
enable_config "CONFIG_OVERLAY_FS" "y"
enable_config "CONFIG_SQUASHFS" "y"
enable_config "CONFIG_SQUASHFS_XZ" "y"
enable_config "CONFIG_FUSE_FS" "y"

# 网络
enable_config "CONFIG_NET" "y"
enable_config "CONFIG_INET" "y"
enable_config "CONFIG_IPV6" "y"
enable_config "CONFIG_NETFILTER" "y"

# 调试和跟踪
enable_config "CONFIG_DEBUG_FS" "y"
enable_config "CONFIG_FTRACE" "y"
enable_config "CONFIG_KPROBES" "y"
enable_config "CONFIG_UPROBES" "y"

# 根据构建模式调整
case "$BUILD_MODE" in
    "permissive")
        enable_config "CONFIG_SECURITY" "y"
        enable_config "CONFIG_SECURITY_SELINUX" "y"
        enable_config "CONFIG_SECURITY_SELINUX_DEVELOP" "y"
        enable_config "CONFIG_SECURITY_SELINUX_PERMISSIVE" "y"
        ;;
    "debug")
        enable_config "CONFIG_DEBUG_KERNEL" "y"
        enable_config "CONFIG_DEBUG_INFO" "y"
        enable_config "CONFIG_GDB_SCRIPTS" "y"
        enable_config "CONFIG_KGDB" "y"
        ;;
esac

# 可选功能
if [ "$USE_SUSFS" = "true" ]; then
    enable_config "CONFIG_KSU_SUSFS" "y"
    enable_config "CONFIG_KSU_SUSFS_SUS_MOUNT" "y"
    enable_config "CONFIG_KSU_SUSFS_SUS_PATH" "y"
    enable_config "CONFIG_KSU_SUSFS_SPOOF_UNAME" "y"
fi

if [ "$USE_KPM" = "true" ]; then
    enable_config "CONFIG_KPM" "y"
fi

if [ "$USE_ZRAM" = "true" ]; then
    enable_config "CONFIG_ZRAM" "y"
    enable_config "CONFIG_ZSMALLOC" "y"
    enable_config "CONFIG_ZSWAP" "y"
    enable_config "CONFIG_CRYPTO_LZ4" "y"
    enable_config "CONFIG_CRYPTO_LZ4K" "y"
fi

if [ "$USE_KCAL" = "true" ]; then
    enable_config "CONFIG_DRM_MSM_KCAL" "y"
fi

if [ "$USE_KSWAPD" = "true" ]; then
    enable_config "CONFIG_SWAP" "y"
    enable_config "CONFIG_ZSWAP" "y"
fi

if [ "$ENABLE_OC" = "true" ]; then
    enable_config "CONFIG_ARM64_CPU_FREQ" "y"
    enable_config "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE" "y"
fi

# 移除不需要的调试
disable_config "CONFIG_DEBUG_PREEMPT"
disable_config "CONFIG_PROVE_LOCKING"
disable_config "CONFIG_DEBUG_ATOMIC_SLEEP"

echo "配置完成"
EOF
          
          chmod +x $CONFIG_SCRIPT
          ./$CONFIG_SCRIPT
          
          # 保存配置
          if command -v make >/dev/null 2>&1; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
            if [ -f "defconfig" ]; then
              cp defconfig "arch/arm64/configs/${DEFCONFIG}_sukisu"
              echo "DEFCONFIG_CUSTOM=${DEFCONFIG}_sukisu" >> $GITHUB_ENV
            fi
          fi

      - name: 编译内核
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/$KERNEL_DIR"
          
          echo "开始编译内核..."
          echo "构建模式: $BUILD_MODE"
          echo "Android版本: $ANDROID_VERSION"
          echo "内核版本: $KERNEL_VERSION.$KERNEL_SUBLEVEL"
          
          # 设置编译环境
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          
          # 设置编译线程数
          CPU_THREADS=$(nproc)
          BUILD_THREADS=$((CPU_THREADS * 2))
          echo "使用 $BUILD_THREADS 线程编译"
          
          # 清理之前的编译
          echo "清理编译环境..."
          make clean 2>/dev/null || true
          make mrproper 2>/dev/null || true
          
          # 加载配置
          echo "加载内核配置..."
          if [ -n "${DEFCONFIG_CUSTOM:-}" ]; then
            make "$DEFCONFIG_CUSTOM"
          else
            make gki_defconfig
          fi
          
          # 开始编译
          echo "开始内核编译..."
          TIMESTAMP=$(date +%s)
          
          # 编译内核映像
          make -j$BUILD_THREADS 2>&1 | tee build.log
          
          BUILD_TIME=$(( $(date +%s) - TIMESTAMP ))
          echo "编译完成，耗时: ${BUILD_TIME}秒"
          
          # 检查编译结果
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image.gz"
          elif [ -f "arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="arch/arm64/boot/Image"
          else
            echo "错误：未找到内核映像文件"
            echo "最后100行编译日志:"
            tail -n 100 build.log
            exit 1
          fi
          
          # 复制内核映像
          cp "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/kernel-image"
          
          # 编译模块（如果配置了）
          if grep -q "CONFIG_MODULES=y" .config; then
            echo "编译内核模块..."
            make modules -j$CPU_THREADS 2>&1 | tee -a build.log
            
            # 安装模块到临时目录
            mkdir -p "$GITHUB_WORKSPACE/modules"
            make modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"
            
            # 打包模块
            cd "$GITHUB_WORKSPACE/modules"
            tar -czf "$GITHUB_WORKSPACE/kernel-modules.tar.gz" lib/modules/
          fi
          
          # 复制编译日志
          cp build.log "$GITHUB_WORKSPACE/build.log"
          
          echo "编译成功!"
          echo "内核映像: $(ls -lh "$GITHUB_WORKSPACE/kernel-image")"

      - name: 创建 AnyKernel3 刷机包
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          echo "创建 AnyKernel3 刷机包..."
          
          # 克隆 AnyKernel3
          if [ ! -d "AnyKernel3" ]; then
            git clone --depth=1 https://github.com/topjohnwu/AnyKernel3.git
          fi
          
          cd AnyKernel3
          
          # 清理之前的文件
          rm -rf modules patch ramdisk *.zip Image*
          
          # 复制内核映像
          if [ -f "$GITHUB_WORKSPACE/kernel-image" ]; then
            cp "$GITHUB_WORKSPACE/kernel-image" Image
            echo "已复制内核映像"
          else
            echo "错误：找不到内核映像"
            exit 1
          fi
          
          # 复制模块（如果存在）
          if [ -f "$GITHUB_WORKSPACE/kernel-modules.tar.gz" ]; then
            mkdir -p modules
            tar -xzf "$GITHUB_WORKSPACE/kernel-modules.tar.gz" -C modules/
            echo "已添加内核模块"
          fi
          
          # 创建 anykernel.sh 脚本
          cat > anykernel.sh << 'EOF'
#!/bin/bash

## AnyKernel3 for iQOO 855 (SM8150) - SukiSU Enhanced
## 由 GitHub Actions 自动生成

# 属性
kernel.string=GKI+SukiSU for iQOO 855
do.devicecheck=1
do.modules=1
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=v1936a
device.name2=iqoo
device.name3=iqoo855
device.name4=sm8150
supported.versions=11-15
supported.patchlevels=

# 分区信息
block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

# 设置工作目录
bin=$TMPDIR/bin;
tools=$TMPDIR/tools;
patch=$TMPDIR/patch;
ramdisk=$TMPDIR/ramdisk;
split_img=$TMPDIR/split_img;
modules=$TMPDIR/modules;

# 显示信息
ui_print " ";
ui_print "==========================================";
ui_print "SukiSU Enhanced Kernel for iQOO 855";
ui_print "Android $ANDROID_VERSION";
ui_print "Kernel $KERNEL_VERSION.$KERNEL_SUBLEVEL";
ui_print "Build Date: $BUILD_DATE";
ui_print "==========================================";
ui_print " ";

# 检查设备兼容性
case "$(getprop ro.product.device)" in
    "v1936a"|"IQOO"|"sm8150")
        ui_print "设备验证通过";
        ;;
    *)
        ui_print "不支持的设备";
        abort;
        ;;
esac

# 检查 Android 版本
case "$(getprop ro.build.version.release)" in
    11|12|13|14|15)
        ui_print "Android 版本验证通过";
        ;;
    *)
        ui_print "不支持的 Android 版本";
        abort;
        ;;
esac

# 加载工具
. $tools/ak3-core.sh;

# 备份引导分区
dump_boot;

# 应用补丁
if [ -d $patch ]; then
    ui_print "应用补丁...";
    cd $patch;
    for p in *.patch; do
        [ -f "$p" ] || continue;
        ui_print "应用补丁: $p";
        patch -p1 -r - < "$p";
    done
fi

# 安装内核模块
if [ -d $modules/lib/modules ]; then
    ui_print "安装内核模块...";
    mkdir -p $TMPDIR/system/lib/modules;
    cp -af $modules/lib/modules/* $TMPDIR/system/lib/modules/;
    
    # 设置模块权限
    chmod -R 755 $TMPDIR/system/lib/modules;
    chown -R root:root $TMPDIR/system/lib/modules;
fi

# 修改内核命令行参数
if [ -f $split_img/kernel ]; then
    ui_print "优化内核参数...";
    
    # 获取当前 cmdline
    cmdline=$(cat $split_img/cmdline);
    
    # 移除冲突参数
    cmdline=$(echo "$cmdline" | sed 's/ androidboot.selinux=.*//g');
    
    # 添加优化参数
    cmdline="$cmdline androidboot.selinux=permissive";
    cmdline="$cmdline ksu.mode=enforcing";
    
    if [ "$USE_ZRAM" = "true" ]; then
        cmdline="$cmdline zram.enabled=1";
    fi
    
    if [ "$ENABLE_OC" = "true" ]; then
        cmdline="$cmdline overclock.enabled=1";
    fi
    
    # 保存修改后的 cmdline
    echo "$cmdline" > $split_img/cmdline;
fi

# 写入新引导分区
write_boot;

# 清理
ui_print "正在清理...";

# 完成提示
ui_print " ";
ui_print "==========================================";
ui_print "刷机完成！请重启设备。";
ui_print " ";
ui_print "功能特性：";
ui_print "✓ SukiSU 内核权限管理";
if [ "$USE_SUSFS" = "true" ]; then
    ui_print "✓ SUSFS 安全文件系统";
fi
if [ "$USE_KPM" = "true" ]; then
    ui_print "✓ KPM 内核模块支持";
fi
if [ "$USE_ZRAM" = "true" ]; then
    ui_print "✓ ZRAM 内存压缩优化";
fi
if [ "$ENABLE_OC" = "true" ]; then
    ui_print "✓ CPU/GPU 超频支持";
fi
ui_print "==========================================";
EOF
          
          # 设置脚本权限
          chmod +x anykernel.sh
          
          # 创建 version 文件
          cat > version << EOF
