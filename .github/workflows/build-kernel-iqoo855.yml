name: Build Kernel

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "arm64"
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "defconfig"
      cross_compile:
        description: "Cross compile prefix"
        required: false
        default: "aarch64-linux-gnu-"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: ${{ github.event.inputs.arch || 'arm64' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'defconfig' }}
      CROSS_COMPILE: ${{ github.event.inputs.cross_compile || 'aarch64-linux-gnu-' }}
      OUT_DIR: out

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            dwarves \
            cpio \
            pahole \
            zip \
            unzip \
            python3 \
            rsync

      - name: Show environment
        run: |
          echo "ARCH=$ARCH"
          echo "DEFCONFIG=$DEFCONFIG"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          mkdir -p "$OUT_DIR"

      - name: Clean output directory
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      - name: Generate config
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"

      - name: Build kernel
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" -j"$(nproc)"

      - name: Build modules
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" modules -j"$(nproc)" || true

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp "$OUT_DIR/.config" artifacts/ || true
          cp "$OUT_DIR/System.map" artifacts/ || true
          cp "$OUT_DIR/vmlinux" artifacts/ || true
          cp "$OUT_DIR/arch/$ARCH/boot/Image" artifacts/ || true
          cp "$OUT_DIR/arch/$ARCH/boot/Image.gz" artifacts/ || true
          cp "$OUT_DIR/arch/$ARCH/boot/bzImage" artifacts/ || true
          find "$OUT_DIR" -name "*.dtb" -exec cp {} artifacts/ \; || true
          find "$OUT_DIR" -name "*.dtbo" -exec cp {} artifacts/ \; || true
          tar -czf kernel-artifacts.tar.gz artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.ARCH }}-artifacts
          path: |
            artifacts
            kernel-artifacts.tar.gz
          if-no-files-found: warn
