name: KernelSU Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sm8250'
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'lineage-20'
      device_config:
        description: 'Device defconfig'
        required: true
        default: 'vendor/kona-perf_defconfig'
      ksu_version:
        description: 'KernelSU version'
        required: false
        default: 'v0.9.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout kernel source
        run: |
          git clone -b ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_source }} kernel
          cd kernel
          
      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | \
            bash -s ${{ github.event.inputs.ksu_version }}
          
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ...
        
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ${{ github.event.inputs.device_config }}
          make -j$(nproc) O=out Image.gz-dtb
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-with-ksu
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
